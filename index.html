<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta name="description" content="Tic-tac-toe (XO) game built with HTML, CSS and JavaScript by Islam Osama.">
    <meta property="og:title" content="XO Game | Islam Osama">

<body>
    <button onclick="resetScore()" class="reset-score">Reset Score</button>
    <div class="score-board">
        <div>X Score: <span id="x-score">0</span></div>
        <div>O Score: <span id="o-score">0</span></div>
    </div>
    <div class="game-container">
        <h1 class="title">XO Game - Islam Osama</h1>
        <div class="board" id="board">
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        <div class="cell" data-cell></div>
        </div>
        <div class="message" id="message"></div>
        <div class="result">
            <span id="winner-text">X Wins!</span>
        </div>
    </div>
    <footer>
    <p>© 2025 Islam Osama</p>
    </footer>
